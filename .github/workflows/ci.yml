name: CI (Windows amd64)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-amd64:
    name: Test & Dev Build (Windows amd64)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go from go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Verify bundled tools lockfile, GPG key, and license compliance files
        run: |
          $lock = Get-Content -Raw scripts/bundled-tools-windows.json | ConvertFrom-Json
          $keyPath = $lock.components.ytDlp.publicKeyFile
          if (-not (Test-Path -LiteralPath $keyPath)) { throw "Missing yt-dlp GPG key: $keyPath" }
          $gotHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $keyPath).Hash.ToLowerInvariant()
          if ($gotHash -ne $lock.components.ytDlp.publicKeySha256.ToLowerInvariant()) {
            throw "yt-dlp public key SHA-256 mismatch: $gotHash"
          }
          foreach ($lic in $lock.requiredLicenses) {
            if (-not (Test-Path -LiteralPath $lic) -or (Get-Item -LiteralPath $lic).Length -eq 0) {
              throw "Missing or empty required license file: $lic"
            }
          }
          if (-not (Test-Path -LiteralPath "packaging/windows/webview2-installer.nsh")) {
            throw "Missing packaging/windows/webview2-installer.nsh"
          }
          Write-Output "Lockfile, GPG key, WebView2 NSIS hook, and licenses verified."

      # Test boundary note: fast PR CI runs Go media tests against system FFmpeg (libx264/libmp3lame),
      # whereas full release builds (release.yml / scripts/build-release-windows.ps1) run the exact same
      # Go test suite against the pinned bundled BtbN LGPL Shared FFmpeg (libopenh264/libmp3lame).
      - name: Ensure system FFmpeg and ffprobe are available for fast PR CI tests
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $chocoBin = "C:\ProgramData\chocolatey\bin"
            if (Test-Path $chocoBin) {
              $env:PATH = "$chocoBin;$env:PATH"
              Add-Content -Path $env:GITHUB_PATH -Value $chocoBin
            }
          }
          ffmpeg -version | Select-Object -First 2
          if ($LASTEXITCODE -ne 0) { throw "ffmpeg is not executable" }
          ffprobe -version | Select-Object -First 2
          if ($LASTEXITCODE -ne 0) { throw "ffprobe is not executable" }
          $encoders = ffmpeg -hide_banner -encoders
          if ($LASTEXITCODE -ne 0 -or -not ($encoders | Select-String -SimpleMatch "libmp3lame")) {
            throw "FFmpeg is missing required libmp3lame encoder"
          }

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Go core and desktop tests (isolated AppData)
        env:
          APPDATA: ${{ runner.temp }}\ci-appdata
          LOCALAPPDATA: ${{ runner.temp }}\ci-localappdata
        run: |
          New-Item -ItemType Directory -Path $env:APPDATA, $env:LOCALAPPDATA -Force | Out-Null
          go test -count=1 ./core/... ./internal/... ./pkg/... ./test/...

      - name: Verify CGO-free Go build
        env:
          CGO_ENABLED: "0"
        run: go build ./...

      - name: Run frontend contract tests
        run: |
          pnpm run test:youtube
          pnpm run test:downloads
          pnpm run test:credentials
          pnpm run test:preferences
          pnpm run test:runtime
          pnpm run test:clipboard

      - name: Typecheck and build frontend
        run: pnpm run build

      - name: Build Windows amd64 dev desktop executable and installer with MyGo
        run: pnpm exec mygo build -platform windows/amd64

      - name: Verify MyGo outputs and bindings sync
        run: |
          $appMeta = Get-Content -Raw mygo.json | ConvertFrom-Json
          $appName = [string]$appMeta.name
          $appSlug = if ($appMeta.slug) { [string]$appMeta.slug } else { ($appName.ToLowerInvariant() -replace '[^a-z0-9]+', '-').Trim('-') }
          $version = [string]$appMeta.version
          $exe = "build/windows-amd64/$appName.exe"
          $setup = "build/windows-amd64/$appSlug-setup-$version-amd64.exe"
          $notices = "build/windows-amd64/THIRD_PARTY_NOTICES.md"
          foreach ($f in @($exe, $setup, $notices)) {
            if (-not (Test-Path $f) -or (Get-Item $f).Length -le 0) {
              throw "Missing or empty build artifact: $f"
            }
          }
          git diff --exit-code -- frontend/src/mygo.ts
          if ($LASTEXITCODE -ne 0) { throw "frontend/src/mygo.ts is out of sync; run pnpm run mygo:generate" }
          Get-ChildItem build/windows-amd64 | Format-Table Name, Length -AutoSize
