name: Release (Windows amd64 Bundled)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to verify/publish (e.g. v1.0.0; defaults to v<mygo.json version>)"
        required: false
        type: string
        default: ""
      create_draft_release:
        description: "Create or update a draft GitHub Release for manual review"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release-windows-amd64:
    name: Build Bundled Runtime & Draft Release (Windows amd64)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Git Tag matches mygo.json version
        id: meta
        run: |
          $meta = Get-Content -Raw mygo.json | ConvertFrom-Json
          $appName = [string]$meta.name
          $appSlug = if ($meta.slug) { [string]$meta.slug } else { ($appName.ToLowerInvariant() -replace '[^a-z0-9]+', '-').Trim('-') }
          $appVersion = [string]$meta.version
          if ([string]::IsNullOrWhiteSpace($appName) -or $appVersion -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.]+)?$') {
            throw "Invalid name or version in mygo.json: name='$appName', version='$appVersion'"
          }
          $expectedTag = "v$appVersion"

          if ("${{ github.event_name }}" -eq "push") {
            $tag = "${{ github.ref_name }}"
            if ($tag -ne $expectedTag) {
              throw "Git tag '$tag' does not match mygo.json version '$appVersion' (expected '$expectedTag')"
            }
            $hasExistingTag = "true"
          } else {
            $inputTag = "${{ inputs.tag }}".Trim()
            if ($inputTag -ne "") {
              if ($inputTag -ne $expectedTag) {
                throw "Input tag '$inputTag' does not match mygo.json version '$appVersion' (expected '$expectedTag')"
              }
              $tag = $inputTag
            } else {
              $tag = $expectedTag
            }
            git rev-parse --verify --quiet "refs/tags/$tag" | Out-Null
            $hasExistingTag = if ($LASTEXITCODE -eq 0) { "true" } else { "false" }
          }

          Write-Output "Verified release metadata: app=$appName slug=$appSlug version=$appVersion tag=$tag existing_tag=$hasExistingTag"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "app_name=$appSlug"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "app_display_name=$appName"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "app_version=$appVersion"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "release_tag=$tag"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "has_existing_tag=$hasExistingTag"

      - name: Refuse to overwrite an already published Release of the same tag
        if: github.event_name == 'push' || inputs.create_draft_release == true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
        run: |
          $info = gh release view "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --json isDraft,url 2>$null
          if ($LASTEXITCODE -eq 0 -and $info) {
            $parsed = $info | ConvertFrom-Json
            if (-not $parsed.isDraft) {
              throw "Release $env:RELEASE_TAG is already publicly published ($($parsed.url)); refusing to overwrite published assets!"
            }
            Write-Output "Existing draft release found for $env:RELEASE_TAG; allowed to update draft."
          }

      - name: Setup Go from go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare, verify, test, build, and check full Windows bundled release
        env:
          MEDIA_FETCHER_TOOL_CACHE: ${{ runner.temp }}\bundled-tools-cache
        run: |
          $distDir = Join-Path $env:RUNNER_TEMP "release-dist"
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-release-windows.ps1 `
            -CacheDir $env:MEDIA_FETCHER_TOOL_CACHE `
            -DistDir $distDir `
            -TestSilentInstall
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify MyGo bindings sync
        run: git diff --exit-code -- frontend/src/mygo.ts

      - name: Upload build artifacts to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.app_name }}-${{ steps.meta.outputs.app_version }}-windows-amd64-bundled
          path: ${{ runner.temp }}/release-dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Create or update draft GitHub Release
        if: github.event_name == 'push' || inputs.create_draft_release == true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          HAS_EXISTING_TAG: ${{ steps.meta.outputs.has_existing_tag }}
          DIST_DIR: ${{ runner.temp }}\release-dist
        run: |
          $lock = Get-Content -Raw scripts/bundled-tools-windows.json | ConvertFrom-Json
          $releaseExists = $false
          $existingJson = gh release view "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0 -and $existingJson) {
            $parsed = $existingJson | ConvertFrom-Json
            if (-not $parsed.isDraft) {
              throw "Release $env:RELEASE_TAG is already publicly published; refusing to overwrite assets!"
            }
            $releaseExists = $true
          }

          if (-not $releaseExists) {
            $notes = @(
              "MFetch (Media Fetcher) $env:RELEASE_TAG (Windows amd64 · Bundled Runtime)",
              "",
              "### Artifacts",
              '- Windows NSIS installer (`mfetch-setup-*-amd64.exe`, includes bundled runtime & WebView2 Evergreen detection)',
              '- Windows portable archive (`mfetch-*-windows-amd64-portable.zip`, includes full bundled runtime & licenses)',
              '- `SHA256SUMS.txt` checksum file',
              '- `THIRD_PARTY_NOTICES.md`',
              "",
              "### Bundled Runtime Components (Out-of-the-Box)",
              "- **yt-dlp**: `$($lock.components.ytDlp.version)` (official Windows onedir; GPG + SHA-256 verified)",
              "- **Deno**: `v$($lock.components.deno.version)` (MIT; official Windows x64 build)",
              "- **FFmpeg / ffprobe**: `$($lock.components.ffmpeg.version)` (`BtbN/FFmpeg-Builds` LGPL-3.0-or-later shared)",
              "",
              "> Note: Full third-party license texts, dependency notices, and pinned corresponding source download instructions (with verified upstream URLs and SHA-256 checksums) are included in ``licenses/`` inside both the installer and portable ZIP (source tarballs are not embedded inside the binary package; corresponding source for GPL/LGPL components can also be obtained via project issue/request per GPLv3/LGPLv3 obligations). Windows binaries are currently unsigned."
            ) -join "`n"

            $createArgs = @(
              "release", "create", "$env:RELEASE_TAG",
              "--repo", "$env:GITHUB_REPOSITORY",
              "--draft",
              "--title", "MFetch $env:RELEASE_TAG",
              "--notes", $notes
            )
            if ($env:HAS_EXISTING_TAG -eq "true") {
              $createArgs += "--verify-tag"
            } else {
              $createArgs += @("--target", "$env:GITHUB_SHA")
            }
            & gh @createArgs
            if ($LASTEXITCODE -ne 0) { throw "Failed to create draft release $env:RELEASE_TAG" }
          }

          $assets = Get-ChildItem $env:DIST_DIR -File | Select-Object -ExpandProperty FullName
          & gh release upload "$env:RELEASE_TAG" @assets --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload release assets" }
